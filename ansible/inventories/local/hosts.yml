---
# CineVote — Local Vagrant Inventory
# Three-tier architecture matching local-deploy/Vagrantfile
#
# Host names are suffixed with "-vm" to avoid Ansible's group/host
# name collision warning. All site.yml references use
# hostvars[groups['frontend'][0]] patterns, so the suffix is transparent.
all:
  vars:
    ansible_user: vagrant
    ansible_ssh_private_key_file: ~/.vagrant.d/insecure_private_key
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
    ansible_python_interpreter: /usr/bin/python3

  children:
    # ── Tier 1: Frontend (Nginx + React SPA) ─────────────────
    frontend:
      hosts:
        frontend-vm:
          ansible_host: 10.10.0.10

    # ── Tier 2: Backend (Node.js Express API) ─────────────────
    backend:
      hosts:
        backend-vm:
          ansible_host: 10.10.0.20

    # ── Tier 3: Storage (PostgreSQL 14) ──────────────────────
    storage:
      hosts:
        storage-vm:
          ansible_host: 10.10.0.30
