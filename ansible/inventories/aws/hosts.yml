# CineVote — AWS Inventory
# Fill in the three IP placeholders from provisioned_vars.yml after running:
#   ./provisioning/provision_pe2_nat_bastion.sh
#
# frontend_public_ip  → ansible_host of frontend-aws
# backend_private_ip  → ansible_host of backend-aws  (and ProxyJump targets)
# storage_private_ip  → ansible_host of storage-aws  (and ProxyJump targets)

all:
  vars:
    ansible_user: ec2-user
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    ansible_python_interpreter: /usr/bin/python3

  children:
    # ── Tier 1: Frontend (Nginx + React SPA) ─────────────────
    frontend:
      hosts:
        frontend-aws:
          ansible_host: "REPLACE_WITH_FRONTEND_PUBLIC_IP"
          ansible_ssh_common_args: >-
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null

    # ── Tier 2: Backend (Node.js Express API) ─────────────────
    backend:
      hosts:
        backend-aws:
          ansible_host: "REPLACE_WITH_BACKEND_PRIVATE_IP"
          ansible_ssh_common_args: >-
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ProxyCommand="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519 -W %h:%p ec2-user@REPLACE_WITH_FRONTEND_PUBLIC_IP"

    # ── Tier 3: Storage (PostgreSQL 14) ──────────────────────
    storage:
      hosts:
        storage-aws:
          ansible_host: "REPLACE_WITH_STORAGE_PRIVATE_IP"
          ansible_ssh_common_args: >-
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ProxyCommand="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519 -W %h:%p ec2-user@REPLACE_WITH_FRONTEND_PUBLIC_IP"
