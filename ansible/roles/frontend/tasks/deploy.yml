---
# Deploy built assets and Nginx config to the frontend VM.

- name: "frontend/deploy | Sync frontend dist/ to Nginx web root"
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../frontend/dist/"
    dest: "{{ frontend_webroot }}/"
    archive: true
    checksum: true
    delete: true
    rsync_path: "sudo rsync"
    rsync_opts:
      - "--no-owner"
      - "--no-group"
      - "--chown={{ nginx_user }}:{{ nginx_user }}"
      - "--chmod=Du=rwx,Dg=rx,Do=rx,Fu=rw,Fg=r,Fo=r"
  register: frontend_sync

- name: "frontend/deploy | Fix web root file ownership"
  ansible.builtin.file:
    path: "{{ frontend_webroot }}"
    owner: "{{ nginx_user }}"
    group: "{{ nginx_user }}"
    recurse: true
  when: frontend_sync.changed

- name: "frontend/deploy | Deploy Nginx site config from template"
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ nginx_conf_path }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: "frontend/deploy | Validate Nginx configuration"
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
  register: nginx_validate
  failed_when: nginx_validate.rc != 0

- name: "frontend/deploy | Remove default Nginx welcome page (idempotent)"
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: Reload nginx

- name: "frontend/deploy | Flush handlers so Nginx reloads before health check"
  ansible.builtin.meta: flush_handlers
